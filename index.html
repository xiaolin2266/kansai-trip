<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>胖狗關西團｜2026 關西行程</title>
  
  <!-- 字型：jf-openhuninn (粉圓體) 作為 Huninn 的開源實作 -->
  <style>
    @import url('https://cdn.jsdelivr.net/gh/justfont/open-huninn-font/font.css');
  </style>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* 顏色與基礎設定 */
    :root {
      --bg-washi: #FFFCF6;
      --border-ink: #3E3A39;
      --color-pink: #F2A497;
      --color-yellow: #F6D27A;
      --color-blue: #A8D3E6;
      --color-green: #B9DAA5;
    }

    body {
      font-family: 'jf-openhuninn', sans-serif;
      background-color: var(--bg-washi);
      color: var(--border-ink);
      overflow-x: hidden;
    }

    /* 繪本風：粗線框、平塗、大圓角、實色陰影 */
    .comic-box {
      background-color: #ffffff;
      border: 3px solid var(--border-ink);
      border-radius: 20px;
      box-shadow: 4px 4px 0px var(--border-ink);
      transition: transform 0.2s ease;
    }
    
    .comic-btn {
      border: 3px solid var(--border-ink);
      border-radius: 20px;
      box-shadow: 4px 4px 0px var(--border-ink);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .comic-btn:active, .comic-btn.active-tab {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--border-ink);
    }
    
    .comic-btn.active-tab {
      background-color: var(--border-ink);
      color: var(--bg-washi);
    }

    .comic-tag {
      border: 2px solid var(--border-ink);
      border-radius: 12px;
      font-weight: 700;
      padding: 2px 10px;
      font-size: 0.85rem;
      display: inline-block;
    }

    /* 動畫設定 (支援減少動態效果) */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    
    @keyframes bounceIn {
      0% { transform: scale(0.95); opacity: 0; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-float {
      animation: float 3s ease-in-out infinite;
    }

    .animate-bounceIn {
      animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-float, .animate-bounceIn {
        animation: none;
        transform: none;
        opacity: 1;
      }
      .comic-box, .comic-btn {
        transition: none;
      }
    }

    /* 時間軸設計 */
    .timeline-container {
      position: relative;
      padding-left: 1.5rem;
    }
    .timeline-container::before {
      content: '';
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 0;
      width: 4px;
      background-color: var(--border-ink);
      border-radius: 2px;
    }
    .timeline-dot {
      position: absolute;
      left: -21px;
      top: 6px;
      width: 16px;
      height: 16px;
      border: 3px solid var(--border-ink);
      background-color: var(--color-yellow);
      border-radius: 50%;
      z-index: 10;
    }

    /* 自訂捲軸與核取方塊 */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    #day-tabs {
      cursor: grab;
    }
    #day-tabs:active {
      cursor: grabbing;
    }

    .todo-checkbox {
      appearance: none;
      min-width: 28px;
      width: 28px;
      height: 28px;
      border: 3px solid var(--border-ink);
      border-radius: 8px;
      background-color: white;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }
    .todo-checkbox:checked {
      background-color: var(--color-green);
    }
    .todo-checkbox:checked::after {
      content: '✔';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--border-ink);
      font-weight: 900;
      font-size: 16px;
    }

    /* 路線預覽：參考景點導覽圖的米色底圖、紅色星號與固定標籤 */
    .leaflet-container {
      background: #e8d9c3 !important;
      outline: none;
      overflow: hidden;
      font-family: 'jf-openhuninn', sans-serif;
    }
    #map-core { width: 100%; height: 100%; min-height: 260px; background: #e8d9c3; isolation: isolate; }
    #map-core img { max-width: none !important; max-height: none !important; }
    #map-core .leaflet-tile { filter: none !important; }
    #map-core .leaflet-control-attribution { font-size: 10px; color: #62584d; background: rgba(255,252,246,.88); }
    #map-core .leaflet-control-zoom a { color: #3E3A39; background: rgba(255,252,246,.95); }
    #map-core .leaflet-control-layers { font-family: 'jf-openhuninn', sans-serif; font-size: 12px; background: rgba(255,252,246,.95); color: #3E3A39; border: 1px solid #b8a995; border-radius: 10px; box-shadow: 0 1px 4px rgba(58,45,34,.18); }
    .custom-map-marker { background: transparent; border: 0; }
    .route-star {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      box-sizing: border-box;
      border-radius: 50%;
      background: #f34d4e;
      border: 2px solid #fff;
      color: #fff;
      font-size: 12px;
      line-height: 1;
      box-shadow: 0 1px 3px rgba(58, 45, 34, .35);
    }
    .map-place-label {
      background: rgba(255,255,255,.04) !important;
      border: 0 !important;
      box-shadow: none !important;
      color: #ef474a !important;
      font-family: 'jf-openhuninn', sans-serif !important;
      font-size: 12px !important;
      font-weight: 900 !important;
      line-height: 1.25 !important;
      padding: 1px 2px !important;
      white-space: nowrap !important;
      text-shadow: -1.5px -1.5px 0 #fff, 1.5px -1.5px 0 #fff, -1.5px 1.5px 0 #fff, 1.5px 1.5px 0 #fff, 0 2px 2px #fff;
      pointer-events: auto;
    }
    .map-place-label::before { display: none !important; }
    .route-path { stroke-linecap: round; }
    .route-star { transition: transform .25s ease, background-color .25s ease, box-shadow .25s ease; }
    .route-star-active { transform: scale(1.45); box-shadow: 0 0 0 5px rgba(243, 77, 78, .35), 0 1px 3px rgba(58, 45, 34, .35); }
    .route-star-done { background: #4a9d6e; }
    .route-card-active { outline: 3px solid #f34d4e; outline-offset: 1px; box-shadow: 0 0 0 5px rgba(243, 77, 78, .25); }
    .route-walker { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; background: #fff; border: 2px solid #3E3A39; border-radius: 50%; box-shadow: 0 2px 4px rgba(58, 45, 34, .4); }
    .map-tile-status {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 1200; max-width: min(88%, 360px); padding: 12px 16px;
      border: 1px solid #b8a995; border-radius: 12px; background: rgba(255,252,246,.96);
      color: #3E3A39; box-shadow: 0 2px 12px rgba(50,40,30,.12);
      font-size: 13px; line-height: 1.5; text-align: center; pointer-events: none;
    }
    .map-tile-status[hidden] { display: none !important; }
    .map-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,252,246,.94);
      border: 1px solid #b8a995;
      border-radius: 999px;
      padding: 5px 9px;
      color: #5d5247;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 1px 3px rgba(58,45,34,.12);
    }
    .map-legend-star { color: #f34d4e; font-size: 13px; }
    @media (max-width: 640px) {
      .map-place-label { font-size: 10px !important; }
      .map-legend { font-size: 10px; padding: 4px 7px; }
    }
  </style>
</head>
<body class="pb-20 text-lg">

    <div class="font-extrabold text-xl flex items-center gap-2">
      🐾 胖狗關西團
    </div>
    <div class="flex gap-4 text-base font-bold">
      <a href="#info" class="hover:text-[#F2A497] transition-colors">資訊</a>
      <a href="#itinerary" class="hover:text-[#A8D3E6] transition-colors">行程</a>
      <a href="#checklist" class="hover:text-[#B9DAA5] transition-colors">待辦</a>
    </div>
  </nav>

  <!-- 首頁主視覺 -->
  <header id="hero" class="pt-28 pb-10 px-4 flex flex-col items-center text-center">
    
    <!-- 自繪 SVG 插圖 (柴犬 + 鳥居 + 飛機) -->
    <div class="animate-float mb-6 w-56 h-56 relative">
      <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
        <!-- 雲朵 -->
        <path d="M 20 180 Q 20 160 40 160 Q 50 140 70 140 Q 90 140 95 160 Q 110 160 110 180 Z" fill="#ffffff" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" />
        <path d="M 160 80 Q 160 65 175 65 Q 185 50 200 50 Q 215 50 220 65 Q 235 65 235 80 Z" fill="#ffffff" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" />
        
        <!-- 飛機 -->
        <g transform="translate(160, 40) rotate(-15)">
          <path d="M 10 30 L 50 30 L 65 40 L 70 40 L 60 25 L 75 25 Q 85 25 85 20 Q 85 15 75 15 L 60 15 L 70 0 L 65 0 L 50 10 L 10 10 Q 0 10 0 20 Q 0 30 10 30 Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
        </g>

        <!-- 鳥居 -->
        <g stroke="#3E3A39" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(50, 80)">
          <rect x="20" y="30" width="12" height="100" fill="#F2A497" />
          <rect x="108" y="30" width="12" height="100" fill="#F2A497" />
          <path d="M 5 20 L 135 20" fill="none" stroke-width="8" />
          <path d="M 5 12 L 135 12" fill="#3E3A39" stroke-width="8" />
          <rect x="15" y="35" width="110" height="8" fill="#F2A497" stroke="none" />
          <path d="M 15 35 L 125 35 M 15 43 L 125 43" fill="none" />
          <rect x="64" y="20" width="12" height="20" fill="#F2A497" />
        </g>
        
        <!-- 柴犬 -->
        <g transform="translate(120, 160)">
          <!-- 耳朵 -->
          <path d="M -25 -15 L -35 -40 L -5 -25 Z" fill="#F6D27A" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
          <path d="M 25 -15 L 35 -40 L 5 -25 Z" fill="#F6D27A" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
          <!-- 臉 -->
          <path d="M -30 -15 Q 0 -35 30 -15 Q 40 5 30 25 Q 0 35 -30 25 Q -40 5 -30 -15 Z" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
          <!-- 白臉頰 -->
          <path d="M -25 0 Q 0 -10 25 0 Q 35 20 25 20 Q 0 30 -25 20 Q -35 20 -25 0 Z" fill="#FFFCF6" stroke="none"/>
          <!-- 眼睛 -->
          <circle cx="-12" cy="0" r="3.5" fill="#3E3A39" />
          <circle cx="12" cy="0" r="3.5" fill="#3E3A39" />
          <!-- 鼻子 -->
          <ellipse cx="0" cy="8" rx="5" ry="3" fill="#3E3A39" />
          <!-- 嘴巴 -->
        <path d="M -8 15 Q 0 20 8 15" fill="none" stroke="#3E3A39" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <h1 class="text-4xl sm:text-5xl font-extrabold mb-5" style="letter-spacing: 0.05em; text-shadow: 2px 2px 0px #F2A497;">胖狗關西團</h1>
  
  <!-- 倒數計時器 -->
  <div class="comic-box p-4 px-8 bg-[#F6D27A] inline-block mb-3">

      <div id="countdown" class="text-2xl sm:text-3xl font-extrabold tracking-wider mt-2">

  <!-- 路線預覽 Modal -->
  <div id="route-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/50 p-3 sm:p-4 transition-opacity">

        <div class="flex flex-row gap-2 sm:gap-4 flex-1 overflow-hidden">

            <div class="absolute top-3 left-3 z-[1000] pointer-events-none">
              <div class="map-legend"><span class="map-legend-star">★</span><span id="map-route-count">今日景點分布</span></div>

            <div id="map-core" class="w-full h-full z-0"></div>

        const isActive = index === currentDayIndex ? "active-tab" : "bg-white text-[#3E3A39]";
        
        btn.className = `comic-btn px-5 py-3 flex-shrink-0 text-lg sm:text-xl ${isActive}`;
        btn.innerText = `Day ${dayData.day}`;
        btn.setAttribute('aria-pressed', index === currentDayIndex ? 'true' : 'false');
        
        btn.onclick = () => {
          currentDayIndex = index;
          renderTabs();
          renderContent();
        };
        tabsContainer.appendChild(btn);
      });
    }

    function cleanLabel(desc) {
      const t = String(desc || '')
        .replace(/夜間散策|周邊散策|逆時針散策|最後掃貨|大進擊\s*[0-9：:]*/g, '')
        .replace(/參觀|參拜|逛街|觀景|散步|遊覽|夜間|午餐|晚餐|早餐|點心/g, '')
        .trim();
      return t || String(desc || '景點');
    }

    }
    function getLocationData(desc) {
      const row = placeCatalog[desc];
      if (row) return makeLoc(row);
      const label = cleanLabel(desc);
      return { label, coord: null, query: desc, wiki: [], en: [], commons: '', must: '', emoji: '📍', generic: false };

    async function getJson(url) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 7000);
      try {
        const res = await fetch(url, { signal: ctrl.signal });
        return res.ok ? await res.json() : null;
      } catch (_) {
        return null;
      } finally {
        clearTimeout(timer);
      }
    }
    async function wikiThumb(lang, title) {
      const data = await getJson(`https://${lang}.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&redirects=1&prop=pageimages%7Cpageprops&piprop=thumbnail&pithumbsize=640&ppprop=disambiguation&format=json&origin=*`);
      const page = Object.values(data?.query?.pages || {})[0];
      if (!page || page.missing !== undefined || page.pageprops?.disambiguation !== undefined) return null;
      const src = page.thumbnail?.source;
      return src && !/\.svg/i.test(src) ? src : null;
    }
    async function commonsThumbs(query, must) {
      const q = encodeURIComponent(query + ' filetype:bitmap');
      const data = await getJson(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${q}&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url%7Cmime&iiurlwidth=640&format=json&origin=*`);
      const pages = Object.values(data?.query?.pages || {}).sort((a, b) => (a.index || 99) - (b.index || 99));
      return pages
        .filter(p => {
          const info = p.imageinfo?.[0];
          return info?.thumburl && /image\/(jpeg|png)/i.test(info.mime || '') && !/map|logo|flag|diagram|locator|icon|stamp/i.test(p.title || '') && (!must || new RegExp(must, 'i').test(p.title || ''));
        })
        .slice(0, 5)
        .map(p => p.imageinfo[0].thumburl);
    }
    // 回傳「候選照片網址清單」；卡片會依序嘗試，前一張載入失敗就換下一張。
    async function findPlacePhoto(loc) {
      if (customPhotos[loc.label]) return [customPhotos[loc.label]];
      if (!loc.wiki.length && !loc.en.length && !loc.commons) return [];
      if (photoCache.has(loc.label)) return photoCache.get(loc.label);
      const [jaList, enList, commonsList] = await Promise.all([
        Promise.all(loc.wiki.map(t => wikiThumb('ja', t))),
        Promise.all(loc.en.map(t => wikiThumb('en', t))),
        loc.commons ? commonsThumbs(loc.commons, loc.must) : Promise.resolve([])
      ]);
      const urls = [...jaList, ...enList, ...commonsList].filter(Boolean);
      const unique = [...new Set(urls)];
      photoCache.set(loc.label, unique);
      return unique;
    }

    function initMap() {
      if (leafletMap) return;
      leafletMap = L.map('map-core', {
        zoomControl: false,
        attributionControl: true,
        preferCanvas: true,
        zoomAnimation: false,
        fadeAnimation: false,
        markerZoomAnimation: false,
        inertia: false,
        worldCopyJump: false,
        zoomSnap: 0.5,
        zoomDelta: 0.5,
        scrollWheelZoom: true,
        keyboard: true
      });
      // 圖磚來源（皆免金鑰）。官方 osm.org 伺服器可能因使用政策回傳 403 封鎖圖，
      // 所以預設改用 OSM France（同樣是 OpenStreetMap 資料、外觀相近），並提供右上角切換鈕。
      const attrOSM = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a>';
      const baseOrder = [];
      const bases = {};
      const makeBase = (name, url, opts) => {
        const layer = L.tileLayer(url, Object.assign({
          detectRetina: false, updateWhenIdle: true, keepBuffer: 2, referrerPolicy: 'origin', minZoom: 3, maxZoom: 19
        }, opts));
        layer._loads = 0; layer._errors = 0;
        layer.on('tileload', () => {
          layer._loads++; mapTileLoadCount++;
          const status = document.getElementById('map-tile-status');
          if (status) status.hidden = true;
        });
        // 連續多張圖磚失敗且沒有任何成功（網路問題、被封鎖的伺服器等）→ 自動換下一個來源
        layer.on('tileerror', () => {
          layer._errors++;
          if (layer._errors >= 4 && layer._loads === 0 && leafletMap.hasLayer(layer)) {
            const next = bases[baseOrder[baseOrder.indexOf(name) + 1]];
            if (next) { leafletMap.removeLayer(layer); next.addTo(leafletMap); }
          }
        });
        bases[name] = layer; baseOrder.push(name);
      };
      makeBase('彩色街道', 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
        { attribution: 'Tiles &copy; Esri &mdash; Source: Esri, HERE, Garmin, USGS, NGA, and others' });
      makeBase('標準街道', 'https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',
        { subdomains: 'abc', attribution: '&copy; OpenStreetMap France | ' + attrOSM });
      makeBase('淡色簡潔', 'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
        { minZoom: 5, maxZoom: 18, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener noreferrer">地理院タイル</a>' });

      let savedBase = null;
      try { savedBase = localStorage.getItem('mapBase2'); } catch (_) {}
      const firstBase = bases[savedBase] ? savedBase : baseOrder[0];
      mapTileLayer = bases[firstBase].addTo(leafletMap);
      L.control.layers(bases, null, { position: 'topright', collapsed: true }).addTo(leafletMap);
      leafletMap.on('baselayerchange', (e) => {
        mapTileLayer = e.layer;
        try { localStorage.setItem('mapBase2', e.name); } catch (_) {}
      });
      markersLayer = L.layerGroup().addTo(leafletMap);
      L.control.zoom({ position: 'bottomright' }).addTo(leafletMap);
    }

    function getShortMapLabel(label) {
      // 地圖上只顯示第一個地標名稱；完整名稱保留在左右景點卡。
      const t = String(label || '景點').split(/[・／/＋+、，,]/)[0].trim() || String(label || '景點');
      return t.length > 8 ? t.slice(0, 8) + '…' : t;
    }

    function openRouteModal(dayIndex) {
      clearRouteTimers();
      stopRouteAnimation();
      const renderToken = ++routeRenderToken;
      const dayData = itineraryData[dayIndex];
      if (!dayData || dayData.events.length === 0) return;
      currentRouteDayNo = dayData.day;

      document.getElementById('modal-title').innerText = `🗺️ Day ${dayData.day} 路線圖`;
      const leftImages = document.getElementById('left-images');
      const rightImages = document.getElementById('right-images');
      leftImages.innerHTML = '';
      rightImages.innerHTML = '';

      const points = [];
      const locList = dayData.events.flatMap(event => getLocations(event.desc).map(loc => Object.assign(loc, { tag: event.tag, tagBg: event.tagBg })));
      const halfIndex = Math.ceil(locList.length / 2);
      locList.forEach((loc, idx) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'comic-box bg-white p-1 sm:p-2 cursor-pointer transform transition-transform hover:-translate-y-1 w-full aspect-[4/5] flex flex-col text-left';
        card.setAttribute('aria-label', `在 Google Maps 搜尋 ${loc.label}`);
        card.addEventListener('click', () => openMaps(loc.label, loc.query));

        const imageFrame = document.createElement('div');
        imageFrame.className = 'rounded overflow-hidden border-2 border-[#3E3A39] flex-1 relative flex items-center justify-center';
        // 沒有照片時：底色沿用該行程的類別色（景點綠／美食黃／購物粉…），放大圖示並標上類別，看起來是刻意設計的卡片。
        imageFrame.style.backgroundColor = loc.tagBg || '#f5f2eb';
        const placeholder = document.createElement('div');
        placeholder.className = 'flex flex-col items-center justify-center gap-1 select-none text-[#3E3A39]';
        placeholder.setAttribute('aria-hidden', 'true');
        const emojiEl = document.createElement('span');
        emojiEl.className = 'text-4xl sm:text-6xl leading-none';
        emojiEl.textContent = loc.emoji;
        placeholder.appendChild(emojiEl);
        if (loc.tag) {
          const tagEl = document.createElement('span');
          tagEl.className = 'text-[10px] sm:text-xs font-extrabold px-2 py-0.5 rounded-full bg-white/70 border border-[#3E3A39]/40';
          tagEl.textContent = loc.tag;
          placeholder.appendChild(tagEl);
        }
        imageFrame.appendChild(placeholder);

        findPlacePhoto(loc).then(urls => {
          if (!urls || !urls.length) return;
          const tryAt = (i) => {
            if (i >= urls.length || !imageFrame.isConnected) return; // 全部失敗就保留表情符號
            const img = new Image();
            img.alt = '';
            img.className = 'w-full h-full object-cover absolute inset-0';
            img.referrerPolicy = 'no-referrer';
            img.decoding = 'async';
            img.onload = () => {
              if (!imageFrame.isConnected) return;
              imageFrame.appendChild(img);
              if (loc.generic) {
                const badge = document.createElement('span');
                badge.className = 'absolute right-0 bottom-0 bg-[#3E3A39]/80 text-white text-[8px] sm:text-[10px] px-1 rounded-tl';
                badge.textContent = '示意圖';
                imageFrame.appendChild(badge);
              }
            };
            img.onerror = () => tryAt(i + 1);
            img.src = urls[i];
          };
          tryAt(0);
        }).catch(() => {});

        const caption = document.createElement('div');
        caption.className = 'font-extrabold text-center text-[#3E3A39] text-[10px] sm:text-xs truncate px-1 mt-1 sm:mt-2';
        caption.title = loc.label;
        caption.textContent = loc.label;
        card.append(imageFrame, caption);
        (idx < halfIndex ? leftImages : rightImages).appendChild(card);
        points.push({ label: loc.label, query: loc.query, mapLabel: getShortMapLabel(loc.label), coord: loc.coord, card });
      });

      document.getElementById('map-route-count').textContent = `今日景點分布・${points.length} 站`;
      lastFocusedEl = document.activeElement;
      document.getElementById('route-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      const closeBtn = document.getElementById('route-close-btn');
      if (closeBtn) closeBtn.focus({ preventScroll: true });
      initMap();
      markersLayer.clearLayers();

      // 所有圖釘一次顯示；不逐點彈跳、不逐站重新定位相機，避免中央地圖亂跳。
      const usablePoints = points.filter(pt => Array.isArray(pt.coord) && pt.coord.length === 2 && pt.coord.every(Number.isFinite));
      const bounds = L.latLngBounds();
      usablePoints.forEach(pt => bounds.extend(pt.coord));

      const drawMapOnce = () => {
        if (renderToken !== routeRenderToken || document.getElementById('route-modal').classList.contains('hidden')) return;
        const tileStatus = document.getElementById('map-tile-status');
        const tileLoadBaseline = mapTileLoadCount;
        const tileCheck = ++mapTileCheckToken;
        if (tileStatus) { tileStatus.textContent = '街道底圖載入中…'; tileStatus.hidden = false; }
        setTimeout(() => {
          if (tileCheck !== mapTileCheckToken || !tileStatus || !tileStatus.isConnected) return;
          const tileImages = mapTileLayer && mapTileLayer._container
            ? Array.from(mapTileLayer._container.querySelectorAll('img.leaflet-tile'))
            : [];
          const hasVisibleMapTiles = tileImages.some(img => img.complete && img.naturalWidth > 0);
          if (!hasVisibleMapTiles && mapTileLoadCount === tileLoadBaseline) {
            tileStatus.textContent = '街道底圖未載入。請確認網路連線後重新整理頁面。';
            tileStatus.hidden = false;
          } else {
            tileStatus.hidden = true;
          }
        }, 7000);
        leafletMap.stop();
        leafletMap.invalidateSize({ pan: false, animate: false });
        markersLayer.clearLayers();
        if (usablePoints.length === 0) return;

        if (usablePoints.length > 1) {
          L.polyline(usablePoints.map(pt => pt.coord), {
            color: '#47a4bf',
            weight: 3,
            opacity: 0.9,
            dashArray: '5 7',
            lineCap: 'round',
            interactive: false,
            className: 'route-path'
          }).addTo(markersLayer);
        }

        usablePoints.forEach((pt, idx) => {
          const icon = L.divIcon({
            className: 'custom-map-marker',
            html: '<div class="route-star" aria-hidden="true">★</div>',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
          });
          const marker = L.marker(pt.coord, { icon, keyboard: true, riseOnHover: false, title: pt.label }).addTo(markersLayer);
          pt.marker = marker;
          const west = bounds.getWest();
          const east = bounds.getEast();
          const span = Math.max(east - west, 0.0001);
          const relativeLng = (pt.coord[1] - west) / span;
          let labelDirection = idx % 2 === 0 ? 'right' : 'left';
          if (relativeLng < 0.18) labelDirection = 'right';
          if (relativeLng > 0.82) labelDirection = 'left';
          marker.bindTooltip(pt.mapLabel, {
            permanent: true,
            direction: labelDirection,
            offset: [labelDirection === 'right' ? 8 : -8, 0],
            opacity: 1,
            className: 'map-place-label',
            interactive: true
          });
          marker.on('click', () => openMaps(pt.label, pt.query));
        });

        // 單一相機更新。較大的右側留白讓自動標籤不容易被地圖邊界截斷。
        if (usablePoints.length === 1) {
          leafletMap.setView(usablePoints[0].coord, 14, { animate: false });
        } else {
          leafletMap.fitBounds(bounds, {
            paddingTopLeft: [30, 28],
            paddingBottomRight: [95, 38],
            maxZoom: 14,
            animate: false
          });
        }
        setupRouteAnimation(usablePoints);
      };

      // Modal 從 display:none 切換為可見後才計算尺寸，連續兩個繪製影格可避開錯誤的初始寬高。
      requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(drawMapOnce, 80)));
    }

    /* ===== 路線模擬動畫：小狗沿著路線依序走過每個景點（直線模擬，不代表實際走法） ===== */
    let currentRouteDayNo = 0;
    let routeAnim = null;
    let routeAnimLayer = null;
    let routeAnimSpeed = 1;
    const prefersReducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function setAnimButton(label) {
      const b = document.getElementById('anim-play');
      if (b) b.textContent = label;
    }
    function clearAnimHighlights() {
      document.querySelectorAll('.route-star-active, .route-star-done').forEach(el => el.classList.remove('route-star-active', 'route-star-done'));
      document.querySelectorAll('.route-card-active').forEach(el => el.classList.remove('route-card-active'));
    }
    function stopRouteAnimation() {
      if (routeAnim && routeAnim.raf) cancelAnimationFrame(routeAnim.raf);
      routeAnim = null;
      if (routeAnimLayer) routeAnimLayer.clearLayers();
      clearAnimHighlights();
      setAnimButton('▶ 播放路線');
      const controls = document.getElementById('route-anim-controls');
      if (controls) controls.classList.add('hidden');
    }
    function setupRouteAnimation(pts) {
      stopRouteAnimation();
      if (!pts || pts.length < 2) return;
      document.getElementById('route-anim-controls').classList.remove('hidden');
      if (!routeAnimLayer) routeAnimLayer = L.layerGroup().addTo(leafletMap);
      routeAnim = { pts, i: 0, phase: 'idle', p: 0, dur: 1, wait: 0, playing: false, finished: false, raf: 0, last: 0, trail: null, trailBase: [], walker: null };
    }
    function lerpLatLng(a, b, t) {
      const z = leafletMap.getZoom();
      const p1 = leafletMap.project(a, z);
      const p2 = leafletMap.project(b, z);
      return leafletMap.unproject(p1.add(p2.subtract(p1).multiplyBy(t)), z);
    }
    function segDuration(a, b) {
      if (prefersReducedMotion()) return 1;
      const km = leafletMap.distance(a, b) / 1000;
      return Math.min(3200, Math.max(900, 700 + km * 350));
    }
    function scrollCardIntoView(card) {
      const col = card.parentElement;
      if (!col) return;
      const cr = card.getBoundingClientRect();
      const pr = col.getBoundingClientRect();
      const delta = cr.top - pr.top - (pr.height - cr.height) / 2;
      col.scrollBy({ top: delta, behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
    }
    function activateStop(a, idx) {
      const pt = a.pts[idx];
      document.querySelectorAll('.route-star-active').forEach(el => { el.classList.remove('route-star-active'); el.classList.add('route-star-done'); });
      document.querySelectorAll('.route-card-active').forEach(el => el.classList.remove('route-card-active'));
      const el = pt.marker && pt.marker.getElement && pt.marker.getElement();
      const star = el && el.querySelector('.route-star');
      if (star) { star.classList.remove('route-star-done'); star.classList.add('route-star-active'); }
      if (pt.card) { pt.card.classList.add('route-card-active'); scrollCardIntoView(pt.card); }
    }
    function beginRouteAnimation(a) {
      routeAnimLayer.clearLayers();
      clearAnimHighlights();
      a.i = 0; a.finished = false; a.phase = 'dwell'; a.wait = 700; a.p = 0;
      a.trailBase = [a.pts[0].coord];
      a.trail = L.polyline(a.trailBase, { color: '#2f8fae', weight: 6, opacity: 0.95, lineCap: 'round', interactive: false }).addTo(routeAnimLayer);
      a.walker = L.marker(a.pts[0].coord, {
        icon: L.divIcon({ className: 'custom-map-marker', html: '<div class="route-walker" aria-hidden="true">🐶</div>', iconSize: [30, 30], iconAnchor: [15, 15] }),
        interactive: false, keyboard: false, zIndexOffset: 1000
      }).addTo(routeAnimLayer);
      activateStop(a, 0);
    }
    function animFrame(ts) {
      const a = routeAnim;
      if (!a || !a.playing) return;
      const dt = Math.min(ts - (a.last || ts), 100); // 切換分頁回來時避免一次跳很遠
      a.last = ts;
      const step = dt * routeAnimSpeed;
      if (a.phase === 'dwell') {
        a.wait -= step;
        if (a.wait <= 0) {
          if (a.i >= a.pts.length - 1) {
            a.playing = false; a.finished = true;
            setAnimButton('↻ 重播');
            return;
          }
          a.phase = 'move'; a.p = 0;
          a.dur = segDuration(a.pts[a.i].coord, a.pts[a.i + 1].coord);
        }
      } else if (a.phase === 'move') {
        a.p += step / a.dur;
        const from = a.pts[a.i].coord;
        const to = a.pts[a.i + 1].coord;
        const pos = lerpLatLng(from, to, Math.min(a.p, 1));
        a.walker.setLatLng(pos);
        a.trail.setLatLngs(a.trailBase.concat([pos]));
        if (a.p >= 1) {
          a.i++;
          a.trailBase.push(to);
          a.trail.setLatLngs(a.trailBase);
          activateStop(a, a.i);
          a.phase = 'dwell'; a.wait = 700;
        }
      }
      a.raf = requestAnimationFrame(animFrame);
    }
    function toggleRouteAnimation() {
      const a = routeAnim;
      if (!a) return;
      if (a.playing) {
        a.playing = false;
        cancelAnimationFrame(a.raf);
        setAnimButton('▶ 繼續');
        return;
      }
      if (a.finished || a.phase === 'idle') beginRouteAnimation(a);
      a.playing = true; a.last = 0;
      setAnimButton('⏸ 暫停');
      a.raf = requestAnimationFrame(animFrame);
    }
    function cycleRouteAnimSpeed() {
      const speeds = [1, 2, 4];
      routeAnimSpeed = speeds[(speeds.indexOf(routeAnimSpeed) + 1) % speeds.length];
      document.getElementById('anim-speed').textContent = routeAnimSpeed + '×';
    }

    /* ===== 在 Google Maps 開啟整天路線 =====
       Google Maps 網址最多 起點 + 9 個中途點 + 終點 = 11 站；超過就分段（相鄰兩段共用交接站）。 */
    const GMAPS_MAX_STOPS = 11;
    function buildMapsDirUrls(stops) {
      const urls = [];
      let start = 0;
      while (start < stops.length - 1) {
        const end = Math.min(start + GMAPS_MAX_STOPS - 1, stops.length - 1);
        const chunk = stops.slice(start, end + 1);
        const enc = encodeURIComponent;
        let url = 'https://www.google.com/maps/dir/?api=1&origin=' + enc(chunk[0]) + '&destination=' + enc(chunk[chunk.length - 1]);
        if (chunk.length > 2) url += '&waypoints=' + enc(chunk.slice(1, -1).join('|'));
        urls.push({ url, from: start + 1, to: end + 1 });
        start = end;
      }
      return urls;
    }
    function openDayRouteInMaps() {
      const a = routeAnim;
      if (!a || a.pts.length < 2) return;
      // 連續相同地點只留一個，避免 Google Maps 出現「起訖點相同」
      const stops = a.pts.map(pt => pt.query || pt.label).filter((q, i, arr) => i === 0 || q !== arr[i - 1]);
      if (stops.length < 2) return;
      const urls = buildMapsDirUrls(stops);
      const note = '\n※ 多個停靠點時，Google Maps 通常無法切換大眾運輸。';
      const text = urls.length === 1
        ? `Day ${currentRouteDayNo} 共 ${stops.length} 站，是否在 Google Maps 開啟整天路線？` + note
        : `Day ${currentRouteDayNo} 共 ${stops.length} 站，超過 Google Maps 單次 ${GMAPS_MAX_STOPS} 站上限，已分成 ${urls.length} 段（` + urls.map(u => `第${u.from}–${u.to}站`).join('、') + '），請依序開啟。' + note;
      document.getElementById('gm-confirm-text').innerText = text;
      const mainLink = document.getElementById('gm-confirm-link');
      mainLink.href = urls[0].url;
      mainLink.textContent = urls.length > 1 ? '開啟第 1 段' : '確認開啟';
      const extra = document.getElementById('gm-extra-links');
      extra.innerHTML = '';
      urls.slice(1).forEach((u, k) => {
        const link = document.createElement('a');
        link.href = u.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
        link.className = 'comic-btn bg-[#A8D3E6] text-[#3E3A39] py-2 text-lg text-center leading-loose';
        link.textContent = `開啟第 ${k + 2} 段`;
        link.addEventListener('click', closeGmModal);
        extra.appendChild(link);
      });
      extra.classList.toggle('hidden', urls.length < 2);
      document.getElementById('gm-confirm').classList.remove('hidden');
    }

    function closeRouteModal() {
      routeRenderToken++;
      clearRouteTimers();
      stopRouteAnimation();
      if (leafletMap) leafletMap.stop();
      document.getElementById('route-modal').classList.add('hidden');
      document.body.style.overflow = '';
      if (lastFocusedEl && lastFocusedEl.focus) lastFocusedEl.focus({ preventScroll: true });
    }

    /* 4. 電腦版滑鼠拖曳與滾輪滑動 */
    const dayTabsContainer = document.getElementById('day-tabs');
    let isDown = false;
    let startX;
    let scrollLeft;

    dayTabsContainer.addEventListener('mousedown', (e) => {
      isDown = true;
      startX = e.pageX - dayTabsContainer.offsetLeft;
      scrollLeft = dayTabsContainer.scrollLeft;
    });

    dayTabsContainer.addEventListener('mouseleave', () => { isDown = false; });
    dayTabsContainer.addEventListener('mouseup', () => { isDown = false; });

    dayTabsContainer.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - dayTabsContainer.offsetLeft;
      const walk = (x - startX) * 2;
      dayTabsContainer.scrollLeft = scrollLeft - walk;
    });

    dayTabsContainer.addEventListener('wheel', (e) => {
      if (e.deltaY !== 0) {
        e.preventDefault();
        dayTabsContainer.scrollLeft += e.deltaY;
      }
    }, { passive: false });
  
    /* 4. 視窗關閉：Esc 與點背景 */
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!document.getElementById('gm-confirm').classList.contains('hidden')) closeGmModal();
      else if (!document.getElementById('route-modal').classList.contains('hidden')) closeRouteModal();
    });
    document.getElementById('route-modal').addEventListener('click', (e) => { if (e.target.id === 'route-modal') closeRouteModal(); });
    document.getElementById('gm-confirm').addEventListener('click', (e) => { if (e.target.id === 'gm-confirm') closeGmModal(); });

    /* 5. 待辦清單：勾選狀態存在瀏覽器（以項目文字為鍵，調整順序也不會錯位） */
    (function persistChecklist() {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem('todoState') || '{}'); } catch (_) {}
      document.querySelectorAll('.todo-checkbox').forEach((box) => {
        const key = (box.nextElementSibling ? box.nextElementSibling.textContent : '').trim();
        if (!key) return;
        box.checked = !!saved[key];
        box.addEventListener('change', () => {
          saved[key] = box.checked;
          try { localStorage.setItem('todoState', JSON.stringify(saved)); } catch (_) {}
        });
      });
    })();
  </script>
</body>
