  <!-- Tailwind CSS -->

  <style>
    /* 顏色與基礎設定 */
    :root {
      --bg-washi: #FFFCF6;
      --border-ink: #3E3A39;
      --color-pink: #F2A497;
      --color-yellow: #F6D27A;
      --color-blue: #A8D3E6;
      --color-green: #B9DAA5;
    }

    body {
      font-family: 'jf-openhuninn', sans-serif;
      background-color: var(--bg-washi);
      color: var(--border-ink);
      overflow-x: hidden;
    }

    /* 繪本風：粗線框、平塗、大圓角、實色陰影 */
    .comic-box {
      background-color: #ffffff;
      border: 3px solid var(--border-ink);
      border-radius: 20px;
      box-shadow: 4px 4px 0px var(--border-ink);
      transition: transform 0.2s ease;
    }
    
    .comic-btn {
      border: 3px solid var(--border-ink);
      border-radius: 20px;
      box-shadow: 4px 4px 0px var(--border-ink);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .comic-btn:active, .comic-btn.active-tab {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--border-ink);
    }
    
    .comic-btn.active-tab {
      background-color: var(--border-ink);
      color: var(--bg-washi);
    }

    .comic-tag {
      border: 2px solid var(--border-ink);
      border-radius: 12px;
      font-weight: 700;
      padding: 2px 10px;
      font-size: 0.85rem;
      display: inline-block;
    }

    /* 動畫設定 (支援減少動態效果) */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    
    @keyframes bounceIn {
      0% { transform: scale(0.95); opacity: 0; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-float {
      animation: float 3s ease-in-out infinite;
    }

    .animate-bounceIn {
      animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-float, .animate-bounceIn {
        animation: none;
        transform: none;
        opacity: 1;
      }
      .comic-box, .comic-btn {
        transition: none;
      }
    }

    /* 時間軸設計 */
    .timeline-container {
      position: relative;
      padding-left: 1.5rem;
    }
    .timeline-container::before {
      content: '';
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 0;
      width: 4px;
      background-color: var(--border-ink);
      border-radius: 2px;
    }
    .timeline-dot {
      position: absolute;
      left: -21px;
      top: 6px;
      width: 16px;
      height: 16px;
      border: 3px solid var(--border-ink);
      background-color: var(--color-yellow);
      border-radius: 50%;
      z-index: 10;
    }

    /* 自訂捲軸與核取方塊 */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .todo-checkbox {
      appearance: none;
      min-width: 28px;
      width: 28px;
      height: 28px;
      border: 3px solid var(--border-ink);
      border-radius: 8px;
      background-color: white;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }
    .todo-checkbox:checked {
      background-color: var(--color-green);
    }
    .todo-checkbox:checked::after {
      content: '✔';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--border-ink);
      font-weight: 900;
      font-size: 16px;
    }
  </style>
</head>

    const targetDate = new Date("2026-12-06T00:00:00").getTime();
    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;
      const el = document.getElementById("countdown");
      
      if (distance < 0) {
        el.innerHTML = "出發啦！🎉";
        return;
      }
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      el.innerHTML = `${days} 天 ${hours} 時 ${minutes} 分`;
    }

    let currentDayIndex = 0;

    /* 渲染上方日期頁籤 */
    function renderTabs() {
      const tabsContainer = document.getElementById("day-tabs");
      tabsContainer.innerHTML = "";
      
      itineraryData.forEach((dayData, index) => {
        const btn = document.createElement("button");
        const isActive = index === currentDayIndex ? "active-tab" : "bg-white text-[#3E3A39]";
        
        btn.className = `comic-btn px-5 py-3 flex-shrink-0 text-lg sm:text-xl ${isActive}`;
        btn.innerText = `Day ${dayData.day}`;
        
        btn.onclick = () => {
          currentDayIndex = index;
          renderTabs();
          renderContent();
        };
        tabsContainer.appendChild(btn);
      });
    }

    /* 渲染下方詳細時間軸 */
    function renderContent() {
      const contentContainer = document.getElementById("itinerary-content");
      const dayData = itineraryData[currentDayIndex];
      
      // 觸發彈跳動畫
      contentContainer.classList.remove("animate-bounceIn");
      void contentContainer.offsetWidth; // 強制重繪
      contentContainer.classList.add("animate-bounceIn");

      // 標題與住宿資訊
      let html = `
        <div class="mb-6 border-b-[3px] border-dashed border-[#3E3A39] pb-4">
          <h3 class="text-2xl font-extrabold flex items-center gap-2">
            📍 第 ${dayData.day} 天行程
          </h3>
          <p class="text-base font-bold mt-2 text-gray-600 flex items-center gap-1">
            <span>🏨 住宿：</span>
            <span class="comic-tag bg-[#FFFCF6]">${dayData.hotel}</span>
          </p>
        </div>
      `;
      
      if (dayData.events.length === 0) {
        html += `<div class="text-center text-gray-500 font-bold mt-10 mb-6 text-lg">本日無景點與餐廳安排，準備搭機平安返家囉！✈️</div>`;
      } else {
        // 時間軸列表
        html += `<div class="timeline-container space-y-7 mt-4">`;
        
        dayData.events.forEach(event => {
          const mustGoBadge = event.mustGo ? `<span class="comic-tag bg-[#F2A497] text-white ml-2 shadow-sm">🌟 必去</span>` : "";
          const noteText = event.note ? `<p class="text-sm font-bold text-gray-500 mt-1 pl-1">💡 ${event.note}</p>` : "";
          
          html += `
            <div class="relative pl-6">
              <div class="timeline-dot"></div>
              <div class="flex flex-col sm:flex-row sm:items-baseline gap-1 sm:gap-4">
                <span class="font-extrabold text-[#3E3A39] text-xl min-w-[70px]">${event.time}</span>
                <div class="mt-1 sm:mt-0">
                  <span class="comic-tag mb-1" style="background-color: ${event.tagBg};">${event.tag}</span>
                  <span class="font-bold text-xl ml-1 leading-snug">${event.desc}</span>
                  ${mustGoBadge}
                  ${noteText}
                </div>
              </div>
            </div>
          `;
        });
        
        html += `</div>`;
      }
      
      contentContainer.innerHTML = html;
    }

    // 初始執行
    renderTabs();
    renderContent();
  </script>
